# QOJ 前端站点：SPA 静态资源 + 后端 API/WebSocket 同源反代（避免跨域）。

# WebSocket Upgrade 头映射；nginx:alpine 的 conf.d 片段位于 http 上下文内，可用 map。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 题目数据包等上传：后端 multipart 上限 50MB，此处留出余量。
    client_max_body_size 64m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 判题同步等待等长请求：后端 go-judge 单请求超时上限 200s，这里放宽到 300s。
    location /api/ {
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # STOMP over native WebSocket。
    location /ws {
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite 产物文件名带内容哈希，可永久缓存。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA 路由（含 /admin、/teacher）回退到入口页；入口页禁止缓存，发版即生效。
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}
