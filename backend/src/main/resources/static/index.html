<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>QOJ</title>
    <style>
      .qoj-boot-loading{position:fixed;inset:0;display:grid;place-items:center;background:#f5f7fa;z-index:9999}
      .qoj-boot-spinner{width:44px;height:44px;border:4px solid #dce8ff;border-top-color:#1677ff;border-radius:50%;animation:qoj-boot-spin .8s linear infinite}
      .qoj-boot-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
      @keyframes qoj-boot-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.qoj-boot-spinner{animation:none}}
    </style>
    <script type="module" crossorigin src="/assets/app-BR9PwwyB.js"></script>
  </head>
  <body>
    <div id="root"><div class="qoj-boot-loading" role="status" aria-live="polite"><span class="qoj-boot-spinner" aria-hidden="true"></span><span class="qoj-boot-label">页面加载中</span></div></div>
  </body>
</html>
